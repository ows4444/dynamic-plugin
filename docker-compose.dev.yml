version: '3.8'

services:
  # Development Database Services
  postgres:
    image: postgres:15-alpine
    container_name: dynamic-plugin-postgres-dev
    environment:
      POSTGRES_DB: plugin_registry_dev
      POSTGRES_USER: plugin_user
      POSTGRES_PASSWORD: plugin_password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./apps/plugin-registry/src/database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dynamic-plugin-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Development Application Services
  plugin-registry:
    build:
      context: .
      dockerfile: apps/plugin-registry/Dockerfile
      target: development
    container_name: dynamic-plugin-registry-dev
    environment:
      NODE_ENV: development
      SERVICE_NAME: plugin-registry
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: plugin_registry_dev
      DB_USERNAME: plugin_user
      DB_PASSWORD: plugin_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      API_PREFIX: api
      LOG_LEVEL: debug
    volumes:
      - .:/app
      - /app/node_modules
      - plugin_storage_dev:/app/storage
    ports:
      - "3002:3002"
      - "9229:9229" # Debug port
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: npm run start:debug

  plugin-host:
    build:
      context: .
      dockerfile: apps/plugin-host/Dockerfile
      target: development
    container_name: dynamic-plugin-host-dev
    environment:
      NODE_ENV: development
      SERVICE_NAME: plugin-host
      PORT: 3001
      PLUGIN_REGISTRY_URL: http://plugin-registry:3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000
      API_PREFIX: api
      LOG_LEVEL: debug
      MAX_PLUGIN_MEMORY: 256
      PLUGIN_TIMEOUT: 60000
    volumes:
      - .:/app
      - /app/node_modules
      - plugin_plugins_dev:/app/plugins
      - plugin_storage_dev:/app/storage
    ports:
      - "3001:3001"
      - "9230:9229" # Debug port (different from registry)
    depends_on:
      - plugin-registry
      - redis
    restart: unless-stopped
    command: npm run start:debug

  plugin-template:
    build:
      context: .
      dockerfile: apps/plugin-template/Dockerfile
      target: development
    container_name: dynamic-plugin-template-dev
    environment:
      NODE_ENV: development
      SERVICE_NAME: plugin-template
      PORT: 3003
      LOG_LEVEL: debug
    volumes:
      - .:/app
      - /app/node_modules
      - plugin_generated_dev:/app/generated
    ports:
      - "3003:3003"
      - "9231:9229" # Debug port (different from others)
    restart: unless-stopped
    command: npm run start:debug

  # Development Tools
  mailhog:
    image: mailhog/mailhog:latest
    container_name: dynamic-plugin-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
  plugin_storage_dev:
  plugin_plugins_dev:
  plugin_generated_dev:

networks:
  default:
    name: dynamic-plugin-network-dev